[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tedit-theme"
version = "1.1.1"
description = "Theme preview, isolated Neovim presets, diagnostics and a configurable TEdit Modern IDE environment."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
tedit = "tedit.cli:main"

[tool.setuptools.packages.find]
include = ["tedit*"]

[tool.setuptools.package-data]
tedit = ["themes/**/*", "profiles/**/*"]
